#
# 検査の実体は make ci-check に集約する。ここに足したくなったら、まず Makefile へ
# 足してこのジョブは呼ぶだけを保つ。
name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci-check:
    # mokume が macOS 26 / Metal 4 を前提に置いているので macOS で走らせる。
    # GitHub のランナーには mokume の描画に足る GPU が無いので、GPU の Suite は飛ぶ
    # (受け渡しの約束の検査は GPU なしで走る)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Install tools
        run: pipx install reuse && pipx inject reuse chardet && pipx install check-jsonschema
      - run: make ci-check
