#
# 検査の実体は make ci-check に集約する。ここに足したくなったら、まず Makefile へ
# 足してこのジョブは呼ぶだけを保つ。
name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci-check:
    # mokume が macOS 26 / Metal 4 を前提に置いているので macOS で走らせる。
    # GitHub のランナーには mokume の描画に足る GPU が無いので、GPU の Suite は飛ぶ
    # (受け渡しの約束の検査は GPU なしで走る)
    runs-on: macos-latest
    # わざと mokumesh 以外の名前で checkout する。App/Package.swift が根をディレクトリ名に
    # 頼らずに引けていることを毎回確かめるため (#13)
    defaults:
      run:
        working-directory: mokumesh-ci
    steps:
      - uses: actions/checkout@v7
        with:
          path: mokumesh-ci
      - name: Select Xcode
        id: xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          echo "swift=$(swift --version 2>/dev/null | head -1 | shasum | cut -c1-12)" >> "$GITHUB_OUTPUT"
      # SwiftPM の取得物 (binaryTarget の zip・git の依存・swift-syntax の prebuilt) を持ち越す。
      # 毎回 GitHub の Release の資産を取りに行くと、その資産が 504 を返すだけでビルドの前で
      # 落ちる (#29)。binaryTarget の zip と prebuilt は、この置き場にあれば外へ取りに行かない
      # (資産は App/Package.swift が版と checksum で固定しているので、古い中身を使うことは無い)。
      # git の依存は版の範囲で引くので更新を見に行くが、clone を持ち越せば取る量が減る
      - name: Cache SwiftPM downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm/artifacts
            ~/Library/Caches/org.swift.swiftpm/repositories
            ~/Library/Caches/org.swift.swiftpm/prebuilts
          key: swiftpm-${{ runner.os }}-${{ steps.xcode.outputs.swift }}-${{ hashFiles('mokumesh-ci/Package.swift', 'mokumesh-ci/App/Package.swift') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-
      - name: Install tools
        run: pipx install reuse && pipx inject reuse chardet && pipx install check-jsonschema
      - run: make ci-check
